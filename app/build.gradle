plugins { id 'com.android.application' }

def ver = (System.getenv("APP_VERSION") ?: "1.0.0")
def vp = ver.tokenize(".").collect { it.toInteger() }
def vcode = vp[0] * 10000 + vp[1] * 100 + vp[2]

android {
    namespace 'com.kakario.endoscope'
    compileSdk 34
    defaultConfig {
        applicationId 'com.kakario.endoscope'
        minSdk 29
        targetSdk 34
        versionCode vcode
        versionName ver
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword System.getenv("KEYSTORE_PASS")
            keyAlias 'endo'
            keyPassword System.getenv("KEYSTORE_PASS")
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging true } }
}

dependencies {
    implementation 'com.herohan:UVCAndroid:1.0.11'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
