name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle :app:assembleRelease --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk EndoscopeCam-1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: EndoscopeCam-1.0.${{ github.run_number }}.apk
