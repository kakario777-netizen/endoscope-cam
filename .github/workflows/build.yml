name: Release APK
on:
  push:
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  build:
    if: github.repository_owner == 'kakario777-netizen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > app/release.jks
      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          APP_VERSION: ${{ github.ref_name }}
        run: |
          export APP_VERSION="${APP_VERSION#v}"
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "EndoscopeCam-${APP_VERSION}.apk"
          rm -f app/release.jks
      - uses: softprops/action-gh-release@v2
        with:
          name: 내시경 카메라 ${{ github.ref_name }}
          files: EndoscopeCam-*.apk
          make_latest: true
