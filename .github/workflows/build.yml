name: Release APK
on:
  push:
    branches: [ main ]
    paths: [ 'VERSION' ]
permissions:
  contents: write
jobs:
  build:
    if: github.repository_owner == 'kakario777-netizen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > app/release.jks
      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          export APP_VERSION="$(cat VERSION | tr -d '[:space:]')"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "EndoscopeCam-${APP_VERSION}.apk"
          rm -f app/release.jks
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: 내시경 카메라 v${{ env.APP_VERSION }}
          files: EndoscopeCam-*.apk
          make_latest: true
